[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeocore-example-data-cleaning"
version = "0.1.0"
description = "zeocore-powered rebuild of agency-data-onboarding-kit: B2B contact/company CSV cleaning as typed tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "zeocore[drive]>=0.1.0",
    "polars>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/data_cleaning"]
