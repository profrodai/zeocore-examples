[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeocore-example-doc-to-bluesky"
version = "0.1.0"
description = "zeocore-powered Google-Doc-to-Bluesky publishing workflow: fetch a Doc's text, post it (with a real link facet) to Bluesky"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "zeocore[calendar,bluesky]>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/doc_to_bluesky"]
